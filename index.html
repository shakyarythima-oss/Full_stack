<!DOCTYPE html>
<html>
<head>
    <title>E-commerce Website</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            padding: 20px;
        }

        .product {
            display: inline-block;
            background: white;
            padding: 15px;
            margin: 10px;
            width: 180px;
            border-radius: 8px;
        }

        button {
            background: blue;
            color: white;
            padding: 8px;
            border: none;
            cursor: pointer;
            margin: 5px;
        }

        input {
            padding: 8px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <h1>My E-commerce Website</h1>

    <h2>All Products</h2>

    <div id="products"></div>

    <h2>Shopping Cart</h2>

    <div id="cart"></div>

    <h3 id="total">Total: ₹0</h3>

    <button onclick="checkout()">Place Order</button>

    <h2>Successful Orders</h2>

    <div id="orders"></div>

    <h2>Seller Panel</h2>

    <h3>Add Product</h3>

    <input type="text" id="name" placeholder="Product Name">

    <input type="number" id="price" placeholder="Price">

    <input type="text" id="description" placeholder="Description">

    <button onclick="addProduct()">Add Product</button>

    <h3>Edit Product</h3>

    <input type="number" id="editId" placeholder="Product ID">

    <input type="text" id="editName" placeholder="New Name">

    <input type="number" id="editPrice" placeholder="New Price">

    <input type="text" id="editDescription" placeholder="New Description">

    <button onclick="editProduct()">Update Product</button>

    <script>

        let products = [];

        let cart = [];

        // SHOW PRODUCTS
        async function showProducts() {

            let response = await fetch("/products");

            products = await response.json();

            let div = document.getElementById("products");

            div.innerHTML = "";

            products.forEach(function(product) {

                div.innerHTML += `
                    <div class="product">
                        <h3>${product.name}</h3>
                        <p>Price: ₹${product.price}</p>
                        <p>${product.description}</p>
                        <button onclick="addToCart(${product.id})">
                            Add to Cart
                        </button>
                        <p>ID: ${product.id}</p>
                    </div>
                `;

            });

        }

        // ADD TO CART
        function addToCart(id) {

            let item = cart.find(p => p.id === id);

            if (item) {
                item.quantity++;
            } else {
                cart.push({
                    id: id,
                    quantity: 1
                });
            }

            showCart();

        }

        // SHOW CART
        function showCart() {

            let div = document.getElementById("cart");

            div.innerHTML = "";

            let total = 0;

            cart.forEach(function(item) {

                let product = products.find(p => p.id === item.id);

                if (!product) return;

                total += product.price * item.quantity;

                div.innerHTML += `
                    <p>
                        ${product.name} -
                        Quantity: ${item.quantity}
                    </p>
                `;

            });

            document.getElementById("total").innerText =
                "Total: ₹" + total;

        }

        // CHECKOUT
        async function checkout() {

            let response = await fetch("/checkout", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    cart: cart
                })

            });

            let order = await response.json();

            if (!response.ok) {
                alert(order);
                return;
            }

            alert("Order placed successfully!");

            cart = [];

            showCart();

            showOrders();

        }

        // SHOW ORDERS
        async function showOrders() {

            let response = await fetch("/orders");

            let orders = await response.json();

            let div = document.getElementById("orders");

            div.innerHTML = "";

            orders.forEach(function(order) {

                div.innerHTML += `
                    <p>
                        Order ID: ${order.id}
                        | Total: ₹${order.total}
                        | ${order.status}
                    </p>
                `;

            });

        }

        // ADD PRODUCT
        async function addProduct() {

            let product = {

                name: document.getElementById("name").value,

                price: document.getElementById("price").value,

                description: document.getElementById("description").value

            };

            let response = await fetch("/products", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(product)

            });

            if (response.ok) {

                alert("Product Added Successfully");

                showProducts();

            } else {
                alert("Unable to add product");
            }

        }

        // EDIT PRODUCT
        async function editProduct() {

            let id = document.getElementById("editId").value;

            let product = {

                name: document.getElementById("editName").value,

                price: document.getElementById("editPrice").value,

                description: document.getElementById("editDescription").value

            };

            let response = await fetch("/products/" + id, {

                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(product)

            });

            if (response.ok) {

                alert("Product Updated Successfully");

                showProducts();

            } else {
                alert("Product not found");
            }

        }

        showProducts();

        showOrders();

    </script>

</body>
</html>
