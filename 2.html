<!DOCTYPE html>
<html>
<head>
    <title>Ten Cards</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
        }

        .container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
        }

        .card {
            min-width: 200px;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
        }

        .card h3 {
            color: blue;
        }

        .card p {
            padding: 10px;
        }
    </style>
</head>

<body>

    <h2>My Ten Cards</h2>
