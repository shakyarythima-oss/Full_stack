<!DOCTYPE html>
<html>
<head>
    <title>Snake and Ladder</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(10, 40px);
            width: 400px;
            margin: 20px auto;
        }

        .box {
            height: 40px;
            border: 1px solid black;
            background-color: lightyellow;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

    <h2>Snake and Ladder Game</h2>

    <h3 id="position">Player Position: 1</h3>

    <div id="board"></div>

    <button onclick="rollDice()">Roll Dice</button>

    <script>
        let board = document.getElementById("board");

        let position = 1;

        let snakes = {
            27: 5,
            40: 18,
            54: 31,
            89: 53,
            99: 80
        };

        let ladders = {
            3: 22,
            8: 30,
            20: 41,
            36: 44,
            51: 67,
            71: 91
        };

        function createBoard() {

            board.innerHTML = "";

            for (let i = 100; i >= 1; i--) {

                let box = document.createElement("div");

                box.className = "box";

                box.innerText = i;

                if (i === position) {
                    box.innerText = i + " P";
                    box.style.backgroundColor = "lightgreen";
                }

                board.appendChild(box);
            }
        }

        function rollDice() {

            if (position === 100) {
                return;
            }

            let dice = Math.floor(Math.random() * 6) + 1;

            let next = position + dice;

            if (next > 100) {
                document.getElementById("position").innerText =
                    "Roll again! You need an exact number.";
                return;
            }

            if (snakes[next]) {
                next = snakes[next];
                alert("Oh no! Snake found.");
            }

            else if (ladders[next]) {
                next = ladders[next];
                alert("Great! You got a ladder.");
            }

            position = next;

            document.getElementById("position").innerText =
                "Player Position: " + position + " | Dice: " + dice;

            createBoard();

            if (position === 100) {
                alert("Congratulations! You won!");
            }
        }

        createBoard();
    </script>

</body>
</html>
